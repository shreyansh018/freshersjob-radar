[project]
name = "freshersjob-radar-api"
version = "0.1.0"
description = "FreshersJob Radar backend: ingestion, classification and search API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "SQLAlchemy>=2.0.35",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "google-genai>=1.0.0",
    "argon2-cffi>=23.3.0",
    "PyJWT>=2.9.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0", "httpx>=0.27.0"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["app*"] } }

# Vercel Services entrypoints. The web service runs the FastAPI app; the
# subscriber is compiled into a private queue-triggered function by Vercel
# Queues. Local Docker ignores these and runs uvicorn + celery worker/beat.
[tool.vercel]
entrypoint = "app.main:app"

[[tool.vercel.subscribers]]
entrypoint = "app.workers.worker:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
addopts = "-q"
